services:
  # Frontend - Static Site
  - type: web
    name: dost-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  # Backend - ASGI Web Service
  - type: web
    name: dost-ai-backend
    runtime: python
    buildCommand: cd backend && chmod +x build.sh && ./build.sh
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT dost.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: dost-ai-backend.onrender.com,dost-ai-0.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://dost-ai-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: dost-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dost-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      # AI Provider Configuration - Configure in Render Dashboard
      # Supported providers: 'gemini', 'openai', 'groq'
      # Set AI_PROVIDER and the corresponding API key below:
      - key: AI_PROVIDER
        sync: false
        # Example: Set to 'gemini', 'openai', or 'groq' in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
        # Set this if using AI_PROVIDER=gemini (get from https://aistudio.google.com/apikey)
      - key: OPENAI_API_KEY
        sync: false
        # Set this if using AI_PROVIDER=openai
      - key: GROQ_API_KEY
        sync: false
        # Set this if using AI_PROVIDER=groq (get from https://console.groq.com)

  # Redis - for Django Channels WebSocket layer
  - type: redis
    name: dost-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Only internal access

databases:
  - name: dost-db
    plan: free
