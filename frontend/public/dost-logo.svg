<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gradients -->
<linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#f0b8a7" />
<stop offset="60%" style="stop-color:#d97c6f" />
<stop offset="100%" style="stop-color:#b85b50" />
</linearGradient>

<linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" style="stop-color:#9acb85" />
  <stop offset="100%" style="stop-color:#c2e0ad" />
</linearGradient>

</defs>

<!-- Leaves on Top -->

<g transform="translate(250, 115)">
<path d="M0 0 Q-25 -45 -55 -35 Q-55 -10 0 0" fill="url(#leafGrad)" />
<path d="M0 0 Q25 -45 55 -35 Q55 -10 0 0" fill="url(#leafGrad)" />
<rect x="-2" y="-5" width="4" height="20" fill="#7fa864" rx="2" />
</g>

<!-- Robot Body/Head -->

<g transform="translate(250, 205) scale(1.2)">
<!-- Headphones/Ears -->
<path d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="url(#purpleGrad)" stroke-width="15" stroke-linecap="round" />
<circle cx="-85" cy="20" r="25" fill="url(#purpleGrad)" />
<circle cx="85" cy="20" r="25" fill="url(#purpleGrad)" />

<!-- Main Body Face -->
<rect x="-75" y="-30" width="150" height="100" rx="20" fill="url(#purpleGrad)" />
<rect x="-60" y="-15" width="120" height="70" rx="15" fill="#fff7eb" />

<!-- Eyes -->
<circle cx="-35" cy="20" r="12" fill="#4b2f29" />
<circle cx="35" cy="20" r="12" fill="#4b2f29" />

<!-- Eye Sparkles -->
<circle cx="-32" cy="15" r="4" fill="white" />
<circle cx="38" cy="15" r="4" fill="white" />
<circle cx="-38" cy="25" r="2" fill="white" opacity="0.6" />
<circle cx="32" cy="25" r="2" fill="white" opacity="0.6" />

<!-- Mouth -->
<path d="M-8 35 Q0 42 8 35" stroke="#4b2f29" stroke-width="3" fill="none" stroke-linecap="round" />


</g>

<!-- Typography -->

<text x="250" y="415" text-anchor="middle" font-family="Brush Script MT, cursive" font-size="70" font-weight="bold" fill="#d97c6f">Dost Ai</text>

</svg>